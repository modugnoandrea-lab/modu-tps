
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica - Andrea Modugno</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px;
        }

        h1 {
            font-size: 40px;
        }

        h2 {
            color: #888;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background: #8b75ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            background: #222;
        }

        th, td {
            padding: 12px;
            border: 1px solid #555;
        }

        th {
            color: #8b75ff;
        }

        a {
            color: #8b75ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>ANDREA MODUGNO</h1>
        <h2>Anagrafica</h2>
        <a href="index.html">Torna alla Home</a>
    </header>

    Nome:
    <input type="text" id="nome"><br><br>

    Cognome:
    <input type="text" id="cognome"><br><br>

    Indirizzo:
    <input type="text" id="indirizzo"><br><br>

    Città:
    <input type="text" id="citta"><br><br>

    Età:
    <input type="number" id="eta"><br><br>

    <button onclick="aggiungi()">Aggiungi</button>

    <table id="tabella">

        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Indirizzo</th>
            <th>Città</th>
            <th>Età</th>
        </tr>

    </table>

    <script>

        function aggiungi() {

            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let citta = document.getElementById("citta").value;
            let eta = document.getElementById("eta").value;

            let riga = document.createElement("tr");

            let c1 = document.createElement("td");
            let c2 = document.createElement("td");
            let c3 = document.createElement("td");
            let c4 = document.createElement("td");
            let c5 = document.createElement("td");

            c1.textContent = nome;
            c2.textContent = cognome;
            c3.textContent = indirizzo;
            c4.textContent = citta;
            c5.textContent = eta;

            riga.appendChild(c1);
            riga.appendChild(c2);
            riga.appendChild(c3);
            riga.appendChild(c4);
            riga.appendChild(c5);

            document.getElementById("tabella").appendChild(riga);

        }

    </script>

</body>
</html>
