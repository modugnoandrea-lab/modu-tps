
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica</title>
</head>

<body>

    <h1>Anagrafica</h1>

    Nome:
    <input type="text" id="nome"><br><br>

    Cognome:
    <input type="text" id="cognome"><br><br>

    Indirizzo:
    <input type="text" id="indirizzo"><br><br>

    Città:
    <input type="text" id="citta"><br><br>

    Età:
    <input type="number" id="eta"><br><br>

    <button onclick="aggiungi()">Aggiungi</button>

    <br><br>

    <table border="1" id="tabella">
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Indirizzo</th>
            <th>Città</th>
            <th>Età</th>
        </tr>
    </table>

    <script>

        function aggiungi() {

            // Prendo i valori degli input
            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let citta = document.getElementById("citta").value;
            let eta = document.getElementById("eta").value;

            // Creo una nuova riga
            let riga = document.createElement("tr");

            // Creo le celle
            let cella1 = document.createElement("td");
            let cella2 = document.createElement("td");
            let cella3 = document.createElement("td");
            let cella4 = document.createElement("td");
            let cella5 = document.createElement("td");

            // Inserisco i dati nelle celle
            cella1.textContent = nome;
            cella2.textContent = cognome;
            cella3.textContent = indirizzo;
            cella4.textContent = citta;
            cella5.textContent = eta;

            // Aggiungo le celle alla riga
            riga.appendChild(cella1);
            riga.appendChild(cella2);
            riga.appendChild(cella3);
            riga.appendChild(cella4);
            riga.appendChild(cella5);

            // Aggiungo la riga alla tabella
            document.getElementById("tabella").appendChild(riga);

        }

    </script>

</body>
</html>
